# Custom ModSecurity rules for Broken Shop (Module 6: WAF)
#
# These are "virtual patches": WAF rules that block an exploit at the proxy
# even before the application code is fixed. The OWASP CRS already catches most
# of these generically; the rules below are teaching examples so students see
# how a targeted rule is written. Each SecRule id must be unique (>= 1000000).
#
# After editing:  sudo nginx -t && sudo systemctl reload nginx
# Watch hits in:  /var/log/modsec_audit.log

# --- Block reflected XSS on the /item/ search box --------------------------
# Matches the classic <script>, onerror=, <img ...> style payloads in ?q=
SecRule ARGS:q "@rx (?i)(<script|onerror\s*=|<img|javascript:)" \
    "id:1000001,phase:2,deny,status:403,log,\
     msg:'Broken Shop: XSS attempt in item search',tag:'xss'"

# --- Block the SQLi UNION / OR 1=1 patterns on the products API ------------
SecRule ARGS:q "@rx (?i)(union\s+select|or\s+'?1'?\s*=\s*'?1|--\s|;\s*drop\s)" \
    "id:1000002,phase:2,deny,status:403,log,\
     msg:'Broken Shop: SQL injection attempt in product search',tag:'sqli'"

# --- Flag IDOR-style access to another user's cart -------------------------
# You cannot fully fix IDOR at the WAF (it needs app-side ownership checks),
# but you can DETECT and log a client supplying an explicit user_id. This rule
# shows the limit of a WAF: it is defence in depth, not a substitute for the
# code fix in the application.
SecRule ARGS:user_id "@rx ^[0-9]+$" \
    "id:1000003,phase:1,pass,log,\
     msg:'Broken Shop: explicit user_id supplied (possible IDOR)',tag:'idor'"
