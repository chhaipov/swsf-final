# ModSecurity master include for Broken Shop (Module 6: WAF)
#
# Referenced from brokenshop.conf via:
#   modsecurity_rules_file /etc/nginx/modsecurity/main.conf;
#
# Load order matters: recommended config -> CRS setup -> CRS rules -> your
# custom rules last (so they can override).

# 1. Base engine config shipped with libmodsecurity (rename the sample first:
#    cp /etc/nginx/modsecurity/modsecurity.conf-recommended \
#       /etc/nginx/modsecurity/modsecurity.conf )
Include /etc/nginx/modsecurity/modsecurity.conf

# Turn the engine from DetectionOnly to blocking once you have tuned it.
# Start in DetectionOnly, read the audit log, THEN switch to On.
SecRuleEngine DetectionOnly

# 2. OWASP Core Rule Set (clone from github.com/coreruleset/coreruleset)
Include /etc/nginx/modsecurity/crs/crs-setup.conf
Include /etc/nginx/modsecurity/crs/rules/*.conf

# 3. Your own custom / virtual-patch rules (loaded last on purpose)
Include /etc/nginx/modsecurity/custom-rules.conf
