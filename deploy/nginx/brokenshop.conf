# Nginx reverse proxy for Broken Shop  (Module 6: HTTPS, headers, WAF)
#
# Copy to /etc/nginx/sites-available/brokenshop and symlink into sites-enabled.
# This file is the "secured" target students build toward. During the FIND
# phase you can start with a plain HTTP proxy and no headers, then add TLS,
# the security headers, and ModSecurity as you work through the hardening tasks.

# ---- Redirect all HTTP to HTTPS -------------------------------------------
server {
    listen 80;
    server_name brokenshop.local;
    return 301 https://$host$request_uri;
}

# ---- HTTPS front door ------------------------------------------------------
server {
    listen 443 ssl;
    server_name brokenshop.local;

    # TLS (Module 6: HTTPS / certificates). For the lab a self-signed cert is
    # fine; generate it with the openssl command in FINAL_PROJECT.md.
    ssl_certificate     /etc/nginx/ssl/brokenshop.crt;
    ssl_certificate_key /etc/nginx/ssl/brokenshop.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ---- Turn ModSecurity on for this site (Module 6: WAF) ----------------
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsecurity/main.conf;

    # ---- Security response headers (Module 6: HTTP Security Headers) ------
    # These are the server-side half of the fixes. The Django app should ALSO
    # set its own; defence in depth. Students add each header and re-test.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 5m;

    location /static/ {
        alias /opt/brokenshop/static/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
