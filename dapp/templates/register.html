{% extends "base.html" %}

{% block title %}Register — Broken Shop{% endblock %}

{% block content %}
<div class="card shadow-sm auth-card">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <div class="fs-1 text-primary"><i class="bi bi-person-plus-fill"></i></div>
            <h1 class="h4 mb-1">Create your account</h1>
            <p class="text-muted small mb-0">Join Broken Shop in seconds</p>
        </div>
        <form action="/register/" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
        </form>
        <p class="text-center small text-muted mt-3 mb-0">
            Already registered? <a href="/login/">Sign in</a>
        </p>
    </div>
</div>
{% endblock %}
